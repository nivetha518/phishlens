<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhishLens</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 16px;background:#f4f5fb}h1 span{color:#4f46e5}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:14px 0}.row{display:flex;gap:8px}input{flex:1;padding:12px;border:1.5px solid #ccd;border-radius:10px;font:15px monospace}button{background:#4f46e5;color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}.badge{display:inline-block;color:#fff;font-weight:800;font-size:12px;padding:6px 12px;border-radius:10px}.Safe{background:#118a4a}.Malicious{background:#d42a37}</style></head><body><h1>Phish<span>Lens</span> 🛡️</h1><p>AI-based malicious URL detection with explanations.</p><div class="card row"><input id="u" placeholder="http://paypal-secure-login.xyz/verify"><button id="go">Scan</button></div><div id="out"></div><script>const $=s=>document.getElementById(s);function score(u){let r=[];let s=0;if(u.length>75){s+=20;r.push("Long URL")}if((u.match(/\./g)||[]).length>3){s+=20;r.push("Many dots")}if(u.includes("-")){s+=10;r.push("Hyphen in domain")}if(u.includes("@")){s+=30;r.push("Contains @")}if(/paypal|secure|login|verify/i.test(u)){s+=15;r.push("Suspicious keyword")}if(u.startsWith("http://")){s+=10;r.push("Not HTTPS")}return{s,r}}; $("go").onclick=()=>{let u=$("u").value.trim();let {s,r}=score(u);let mal=s>=30;let cls=mal?"Malicious":"Safe";let pct=mal?Math.min(95,60+s):90; $("out").innerHTML=`<div class=card><span class="badge ${cls}">${cls} - ${pct}%</span><p>${mal?r.join(", "):"Clean URL structure"}</p></div>`}</script></body></html>
